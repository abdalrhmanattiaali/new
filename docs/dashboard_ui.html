<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم | مساعد العائلة</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap');
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #22d3ee;
      --accent-2: #a855f7;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; font-family: 'Cairo', 'Inter', sans-serif; }
    body { margin: 0; background: radial-gradient(circle at 20% 20%, #122341, #0f172a 45%), linear-gradient(135deg, #0ea5e9 0%, #7c3aed 50%, #0f172a 100%); color: var(--text); min-height: 100vh; }
    header { padding: 24px; text-align: center; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); box-shadow: 0 10px 40px rgba(0,0,0,0.35); }
    h1 { margin: 0; font-size: 28px; letter-spacing: 0.5px; }
    .subtitle { color: var(--muted); margin-top: 8px; }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .grid { display: grid; gap: 16px; }
    .grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .card { background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255,255,255,0.04); border-radius: 16px; padding: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.25); }
    .card h2 { margin: 0 0 8px; font-size: 18px; }
    .metric { font-size: 32px; font-weight: 700; margin: 8px 0; }
    .muted { color: var(--muted); font-size: 14px; }
    .feature-btn { width: 100%; border: none; padding: 12px; border-radius: 12px; cursor: pointer; color: #0f172a; font-weight: 700; font-size: 15px; transition: transform 0.1s ease, box-shadow 0.2s; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 8px 20px rgba(34, 211, 238, 0.35); }
    .feature-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(168, 85, 247, 0.35); }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 8px; }
    .pill { padding: 4px 10px; border-radius: 999px; background: rgba(34,211,238,0.15); border: 1px solid rgba(34,211,238,0.35); color: var(--text); font-size: 12px; }
    textarea, input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); background: rgba(15,23,42,0.7); color: var(--text); }
    label { font-size: 14px; color: var(--muted); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,0.08); font-size: 13px; }
    .list { display: grid; gap: 8px; }
    .list-item { padding: 10px; background: rgba(255,255,255,0.06); border-radius: 10px; border: 1px solid rgba(255,255,255,0.04); }
    .status { color: var(--success); font-weight: 700; }
    button.secondary { background: rgba(255,255,255,0.08); color: var(--text); box-shadow: none; }
    @media (max-width: 720px) { header { padding: 16px; } main { padding: 16px; } }
  </style>
</head>
<body>
  <header>
    <h1>لوحة التحكم الذكية</h1>
    <div class="subtitle">إدارة الإشعارات، الاختبارات، والاقتراحات المدعومة بالذكاء الاصطناعي</div>
  </header>
  <main>
    <section class="grid cols-3" id="metrics"></section>

    <div class="section-title">
      <h2>اختبار سريع لكل ميزة</h2>
      <span class="pill">إشعار واحد في الساعة - عبر الـ Orchestrator</span>
    </div>
    <div class="grid cols-3" id="feature-grid"></div>

    <div class="card" style="margin-top:16px;">
      <div class="grid cols-3">
        <div>
          <label>معرّف الأسرة</label>
          <input id="familyId" placeholder="مثال: 1" />
        </div>
        <div>
          <label>معرّف الوصي (اختياري)</label>
          <input id="guardianId" placeholder="مثال: 2" />
        </div>
        <div style="display:flex; align-items:flex-end; gap:8px;">
          <button class="feature-btn secondary" style="color:var(--text);" onclick="refreshSummary()">تحديث البيانات</button>
        </div>
      </div>
      <p class="muted" id="defaults-hint"></p>
    </div>

    <div class="section-title">
      <h2>اقتراح إعداد أو قالب بواسطة الذكاء الاصطناعي</h2>
      <span class="pill">لغة احترافية حنونة</span>
    </div>
    <div class="card">
      <div class="grid cols-3">
        <div>
          <label>الموضوع</label>
          <input id="aiTopic" placeholder="مثال: ضبط أوقات الطقس أو زر جديد" />
        </div>
        <div>
          <label>الصيغة المفضلة</label>
          <input id="aiFormat" placeholder="YAML, JSONL, نص مختصر..." />
        </div>
      </div>
      <div style="margin-top:12px;">
        <label>السياق الحالي</label>
        <textarea id="aiContext" rows="4" placeholder="صف ما تحتاجه، أو الصق جزء التكوين الحالي"></textarea>
      </div>
      <div style="margin-top:12px; display:flex; gap:8px; align-items:center;">
        <button class="feature-btn" onclick="askAI()">اطلب اقتراحًا</button>
        <span class="status" id="aiStatus"></span>
      </div>
      <pre id="aiResult" style="margin-top:12px; white-space:pre-wrap; background:rgba(0,0,0,0.25); padding:12px; border-radius:12px; min-height:70px;"></pre>
    </div>

    <div class="section-title">
      <h2>أحدث الإشعارات والسجل</h2>
      <span class="pill">history-aware</span>
    </div>
    <div class="grid cols-3" id="history-list"></div>
  </main>

  <script>
    let summaryCache = null;

    async function refreshSummary() {
      const res = await fetch('/api/dashboard/summary');
      summaryCache = await res.json();
      renderMetrics(summaryCache);
      renderFeatures(summaryCache);
      renderHistory(summaryCache.latest_history || []);
      const defaultHint = `الأسرة الافتراضية: ${summaryCache.dashboard.default_family_id || 'لم تُحدد'}, الوصي الافتراضي: ${summaryCache.dashboard.default_guardian_id || 'اختياري'}`;
      document.getElementById('defaults-hint').innerText = defaultHint;
      if (summaryCache.dashboard.default_family_id && !document.getElementById('familyId').value) {
        document.getElementById('familyId').value = summaryCache.dashboard.default_family_id;
      }
    }

    function renderMetrics(data) {
      const metrics = [
        { label: 'الأسر المسجلة', value: data.counts.families },
        { label: 'الأوصياء', value: data.counts.guardians },
        { label: 'الأطفال', value: data.counts.children },
        { label: 'رسائل معلّقة', value: data.counts.pending_messages },
        { label: 'جروبات مسموح بها', value: data.counts.allowed_groups }
      ];
      document.getElementById('metrics').innerHTML = metrics
        .map((m) => `<div class="card"><h2>${m.label}</h2><div class="metric">${m.value}</div><div class="muted">بيانات مباشرة من القاعدة</div></div>`) 
        .join('');
    }

    function renderFeatures(data) {
      const grid = document.getElementById('feature-grid');
      grid.innerHTML = data.dashboard.features
        .map(
          (f) => `
          <div class="card">
            <div class="section-title" style="margin:0 0 8px;">
              <h2>${f.title}</h2>
              <span class="pill">${f.id}</span>
            </div>
            <p class="muted">${f.description || ''}</p>
            <button class="feature-btn" onclick="triggerTest('${f.id}')">اختبار الآن</button>
          </div>
        `
        )
        .join('');
    }

    async function triggerTest(featureId) {
      const familyId = document.getElementById('familyId').value || null;
      const guardianId = document.getElementById('guardianId').value || null;
      const res = await fetch('/api/dashboard/test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ featureId, familyId, guardianId })
      });
      const result = await res.json();
      alert(result.ok ? `تم جدولة اختبار (${result.message_type})` : `فشل الجدولة: ${result.message || 'خطأ'}`);
      refreshHistory(familyId || summaryCache.dashboard.default_family_id);
    }

    async function askAI() {
      document.getElementById('aiStatus').innerText = '... جاري التوليد';
      const payload = {
        topic: document.getElementById('aiTopic').value,
        desiredFormat: document.getElementById('aiFormat').value,
        context: document.getElementById('aiContext').value
      };
      const res = await fetch('/api/dashboard/ai-suggest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      document.getElementById('aiStatus').innerText = data.ok ? 'تم' : 'تعذر التوليد';
      document.getElementById('aiResult').innerText = data.suggestion || data.message || '';
    }

    async function refreshHistory(familyId) {
      if (!familyId) return;
      const res = await fetch(`/api/dashboard/history?family_id=${familyId}&limit=12`);
      const data = await res.json();
      renderHistory(data.history || []);
    }

    function renderHistory(items) {
      const container = document.getElementById('history-list');
      if (!items.length) {
        container.innerHTML = '<div class="card">لا يوجد سجل حديث.</div>';
        return;
      }
      container.innerHTML = items
        .map(
          (item) => `
            <div class="card list-item">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <strong>${item.messageType}</strong>
                <span class="pill">#${item.sequence || '-'} | ${item.slotLabel || ''}</span>
              </div>
              <div class="muted">${item.createdAt || ''}</div>
              <div style="margin-top:6px; white-space:pre-wrap;">${(item.content || '').slice(0, 240)}</div>
            </div>
          `
        )
        .join('');
    }

    refreshSummary();
  </script>
</body>
</html>
